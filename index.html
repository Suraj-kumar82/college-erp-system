<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRGC ERP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Authentication Gateway -->
     <section id="auth-section" class="auth-wrapper">
        <div class="login-card">


            <!-- logo & heading -->
            <div class="logo">
                <img src="image.png" alt="SRGC LOGO" class="clg-logo-img">
                <h1>SRGC ERP</h1>
                <p>Shree Ram Group Of Colleges Portal</p>
            </div>

    
            <!-- Login form -->
             <form id="login-form">
                <div class="input-group">
                    <label for="user-email">Email</label>
                    <input type="email"
                           id="user-email"
                           placeholder="example@student.srgc.edu"
                           required
                           autocomplete="off" 
                    >
                </div>
                <div class="input-group">
                    <label for="user-password">Password</label>
                    <input type="password"
                           id="user-password"
                           placeholder="********"
                           required 
                    >
                </div>

                    <!-- Error/succes Message Box -->
                     <div id="alert" class="alert-box hidden"></div>
                     <button type="submit" id="login-btn" class="primary-btn">Authenticate</button>
             </form>

             <div class="card-footer">Authorized Personal only</div>

        </div>
     </section>

    <!-- STUDENT DASHBOARD VIEW -->
    <section id="student-dashboard" class="view hidden">

        <!-- LEFT NAVIGATION SIDE BAR -->
         <aside class="sidebar">
            <div class="logo">SRGC ERP</div>
            <UL class="nav-links">
                <li class="active"><a href="#">DASHBOARD</a></li>
                <li><a href="#">ATTENDANCE</a></li>
                <li><a href="#">MARKS & GRADES</a></li>
                <li><a href="#">FEES STRUCTURE</a></li>
                <li><a href="#">PROFILES</a></li>
            </UL>
         </aside>
         
         <!-- RIGHT MAIN DISPLAY AREA -->
         <main class="main-content">
            <!-- TOP HAEDER BAR -->
             <header class="top-header">
                <h3>Welcome, <span id="student-name">Student</span>!</h3>
                <button id="logout-btn" class="btn-logout">LOGOUT</button>
             </header>
            <!-- STATS CARD CONTAINER -->
             <div class="dashboar-cards">
                <div class="card">
                    <h4>ATTENDANCE</h4>
                    <p class="stat">85%</p>
                </div>
                <div class="card">
                    <h4>CURRENT CGPA</h4>
                    <p class="stat">8.5</p>
                </div>
                <div class="card">
                    <h4>PENDING FEE</h4>
                    <p class="card">&#8377;0</p>
                </div>
             </div>
         </main> 
    </section>
    <!-- FACULTY DASHBOARD VIEW -->
    <section id="faculty-dashboard" class="view hidden"></section>
    <!-- ADMIN DASHBOARD VIEW -->
    <section id="admin-dashboard" class="view hidden"></section>
    <script src="script.js"></script>
</body>
</html>
